<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
</head>
<body>
    

    <!-- הצגת התמונה באמצעות тег img -->
    <img src="Add-blockers/ABP.svg"  style="max-width: 100%; height: auto;">

    <!-- הצגת התמונה באמצעות CSS background -->
    <div style="width: 200px; height: 200px; background-image: url('Add-blockers/ABP.svg'); background-size: contain; background-repeat: no-repeat; margin-top: 20px;"></div>

    <!-- הצגת התמונה באמצעות тег object (מאפשר אינטראקציה עם ה-SVG) -->
    <object data="Add-blockers/ABP.svg" type="image/svg+xml" style="width: 200px; height: 200px; margin-top: 20px;">
        <p>לא ניתן להציג את הקובץ ABP.svg. אנא ודא שהנתיב נכון.</p>
    </object>
</body>
</html>
